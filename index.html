<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Boston Sports Banner</title>
  <style>
    :root{
      --bg:#0b0e13;
      --panel:#141922;
      --line:#283140;
      --text:#f7f9fc;
      --muted:#aab4c3;
      --live:#ef3340;
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:transparent;
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    body{padding:6px}
    .banner{
      width:100%;
      height:100%;
      min-height:118px;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
      background:var(--bg);
      border:1px solid #202735;
      border-radius:22px;
      padding:8px;
      box-shadow:0 12px 30px rgba(0,0,0,.35);
    }
    .team{
      position:relative;
      min-width:0;
      overflow:hidden;
      background:linear-gradient(145deg,#171d27,#11161e);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:10px 12px 9px;
    }
    .team::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:5px;
      background:var(--accent);
    }
    .header{
      display:flex;
      align-items:center;
      gap:9px;
      margin-bottom:6px;
      min-width:0;
    }
    .logo{
      width:34px;height:34px;object-fit:contain;flex:0 0 auto;
      filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));
    }
    .name{
      font-size:15px;
      font-weight:800;
      letter-spacing:.06em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .status{
      margin-left:auto;
      font-size:10px;
      font-weight:800;
      letter-spacing:.08em;
      color:var(--muted);
      white-space:nowrap;
    }
    .status.live{
      color:white;
      background:var(--live);
      border-radius:999px;
      padding:3px 7px;
      box-shadow:0 0 0 3px rgba(239,51,64,.15);
    }
    .primary{
      display:flex;
      align-items:baseline;
      gap:8px;
      min-height:27px;
      white-space:nowrap;
      overflow:hidden;
    }
    .primary strong{
      font-size:19px;
      line-height:1;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .primary span{
      color:var(--muted);
      font-size:12px;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .upcoming{
      margin-top:5px;
      padding-top:5px;
      border-top:1px solid rgba(255,255,255,.08);
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:5px;
    }
    .game{
      min-width:0;
      border-radius:8px;
      background:rgba(255,255,255,.035);
      padding:4px 5px;
      text-align:center;
    }
    .game .when{
      display:block;
      color:var(--muted);
      font-size:9px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .game .opp{
      display:block;
      margin-top:2px;
      font-size:11px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .loading,.error{
      color:var(--muted);
      font-size:12px;
      padding-top:4px;
    }
    @media (max-width:700px){
      .banner{gap:5px;padding:5px}
      .team{padding:9px 8px 7px}
      .logo{width:28px;height:28px}
      .name{font-size:12px}
      .primary strong{font-size:15px}
      .primary span{font-size:10px}
      .game .opp{font-size:9px}
      .game .when{font-size:8px}
    }
  </style>
</head>
<body>
  <main class="banner" id="banner"></main>

<script>
const TEAMS = [
  {
    name:"RED SOX", short:"BOS", sport:"baseball", league:"mlb", slug:"bos",
    accent:"#BD3039",
    logo:"https://a.espncdn.com/i/teamlogos/mlb/500/bos.png"
  },
  {
    name:"CELTICS", short:"BOS", sport:"basketball", league:"nba", slug:"bos",
    accent:"#007A33",
    logo:"https://a.espncdn.com/i/teamlogos/nba/500/bos.png"
  },
  {
    name:"PATRIOTS", short:"NE", sport:"football", league:"nfl", slug:"ne",
    accent:"#0C2340",
    logo:"https://a.espncdn.com/i/teamlogos/nfl/500/ne.png"
  }
];

const banner = document.getElementById("banner");

function cardShell(team){
  const el=document.createElement("section");
  el.className="team";
  el.style.setProperty("--accent",team.accent);
  el.innerHTML=`
    <div class="header">
      <img class="logo" src="${team.logo}" alt="">
      <div class="name">${team.name}</div>
      <div class="status">LOADING</div>
    </div>
    <div class="loading">Loading scores and schedule…</div>`;
  return el;
}

const cards = new Map();
TEAMS.forEach(t=>{
  const el=cardShell(t);
  cards.set(t.name,el);
  banner.appendChild(el);
});

function eventDate(event){
  return new Date(event.date || event.competitions?.[0]?.date);
}
function competition(event){ return event.competitions?.[0]; }
function teamCompetitor(event, slug){
  const comps=competition(event)?.competitors || [];
  return comps.find(c =>
    (c.team?.abbreviation || "").toLowerCase()===slug ||
    (c.team?.slug || "").toLowerCase().includes(slug)
  );
}
function opponentCompetitor(event, slug){
  const mine=teamCompetitor(event,slug);
  return (competition(event)?.competitors || []).find(c=>c!==mine);
}
function isLive(event){
  return event.status?.type?.state==="in" || event.status?.type?.completed===false &&
         new Date(event.date)<=new Date() && event.status?.type?.state!=="pre";
}
function isFinal(event){
  return event.status?.type?.completed===true || event.status?.type?.state==="post";
}
function gameStatus(event){
  return event.status?.type?.shortDetail || event.status?.type?.detail || "";
}
function formatWhen(date){
  return new Intl.DateTimeFormat("en-US",{
    weekday:"short", hour:"numeric", minute:"2-digit"
  }).format(date);
}
function matchupText(event, team){
  const mine=teamCompetitor(event,team.slug);
  const opp=opponentCompetitor(event,team.slug);
  if(!mine || !opp) return "TBD";
  const venue = mine.homeAway==="home" ? "vs" : "@";
  return `${venue} ${opp.team?.abbreviation || opp.team?.shortDisplayName || "TBD"}`;
}
function primaryText(event, team){
  const mine=teamCompetitor(event,team.slug);
  const opp=opponentCompetitor(event,team.slug);
  if(!mine || !opp) return {big:"Schedule",small:"Upcoming games"};
  const mineScore=mine.score ?? "0";
  const oppScore=opp.score ?? "0";
  const oppAbbr=opp.team?.abbreviation || "OPP";
  if(isLive(event) || isFinal(event)){
    return {
      big:`${team.short} ${mineScore} – ${oppScore} ${oppAbbr}`,
      small:gameStatus(event)
    };
  }
  return {
    big:`${matchupText(event,team)}`,
    small:formatWhen(eventDate(event))
  };
}

async function loadTeam(team){
  const url=`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.slug}/schedule`;
  const res=await fetch(url,{cache:"no-store"});
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const data=await res.json();
  const events=(data.events || []).slice().sort((a,b)=>eventDate(a)-eventDate(b));
  const now=new Date();

  const live=events.find(isLive);
  const recentFinal=[...events].reverse().find(e=>isFinal(e) && (now-eventDate(e))<8*60*60*1000);
  const future=events.filter(e=>!isFinal(e) && eventDate(e)>now-2*60*60*1000);
  const featured=live || recentFinal || future[0] || events[events.length-1];
  const nextGames=future.filter(e=>!featured || e.id!==featured.id).slice(0,3);

  renderTeam(team,featured,nextGames);
}

function renderTeam(team,featured,nextGames){
  const el=cards.get(team.name);
  let statusText="NEXT";
  let statusClass="";
  if(featured && isLive(featured)){statusText="LIVE";statusClass="live";}
  else if(featured && isFinal(featured)){statusText="FINAL";}
  const primary=featured ? primaryText(featured,team) : {big:"Offseason",small:"Schedule unavailable"};

  const gamesHtml=(nextGames.length ? nextGames : featured ? [featured] : []).slice(0,3).map(e=>`
    <div class="game">
      <span class="when">${formatWhen(eventDate(e))}</span>
      <span class="opp">${matchupText(e,team)}</span>
    </div>`).join("");

  el.innerHTML=`
    <div class="header">
      <img class="logo" src="${team.logo}" alt="">
      <div class="name">${team.name}</div>
      <div class="status ${statusClass}">${statusText}</div>
    </div>
    <div class="primary">
      <strong>${primary.big}</strong>
      <span>${primary.small}</span>
    </div>
    <div class="upcoming">${gamesHtml || `<div class="game"><span class="when">No games posted</span><span class="opp">—</span></div>`}</div>`;
}

function renderError(team){
  const el=cards.get(team.name);
  el.innerHTML=`
    <div class="header">
      <img class="logo" src="${team.logo}" alt="">
      <div class="name">${team.name}</div>
      <div class="status">OFFLINE</div>
    </div>
    <div class="error">Sports data is temporarily unavailable. Retrying automatically.</div>`;
}

async function refresh(){
  await Promise.all(TEAMS.map(async t=>{
    try{ await loadTeam(t); }
    catch(err){ console.error(t.name,err); renderError(t); }
  }));
}
refresh();
setInterval(refresh,60000);
</script>
</body>
</html>
